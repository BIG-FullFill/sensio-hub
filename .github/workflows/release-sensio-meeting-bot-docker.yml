name: Sensio Meeting Bot Docker GHCR Release

on:
  push:
    branches:
      - main
    paths:
      - "deploy/notes/meeting-bot/**"
      - ".github/workflows/release-sensio-meeting-bot-docker.yml"
  repository_dispatch:
    types:
      - meeting-bot-release
  workflow_dispatch:
    inputs:
      attendee_ref:
        description: "attendee-labs/attendee tag, branch, or commit SHA"
        required: false
        default: "v1.100.6"
      version:
        description: "Optional GHCR image tag override (defaults to attendee_ref)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: sensio-hub-docker-meeting-bot
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish Attendee Sidecar GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout attendee-labs/attendee
        uses: actions/checkout@v4
        with:
          repository: attendee-labs/attendee
          ref: ${{ inputs.attendee_ref || github.event.client_payload.attendee_ref || 'v1.100.6' }}
          path: attendee-src
          persist-credentials: false

      - name: Resolve Image Tag & Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.attendee_ref || github.event.client_payload.attendee_ref || 'v1.100.6' }}"
          tag="${{ inputs.version || '' }}"
          if [ -z "$tag" ]; then
            tag="$ref"
          fi
          sha="$(git -C attendee-src rev-parse HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Sensio Meeting Bot Image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: attendee-src
          file: attendee-src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/big-fullfill/sensio-meeting-bot:${{ steps.meta.outputs.tag }}
            ghcr.io/big-fullfill/sensio-meeting-bot:latest
          labels: |
            org.opencontainers.image.title=Sensio Meeting Bot
            org.opencontainers.image.source=https://github.com/BIG-FullFill/sensio-hub
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=sensio-meeting-bot-docker
          cache-to: type=gha,mode=max,scope=sensio-meeting-bot-docker
