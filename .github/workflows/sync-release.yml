name: Release Sync

on:
  repository_dispatch:
    types: [iot-release, notes-release]
  workflow_dispatch:
    inputs:
      type:
        description: "Release product type ('iot' or 'notes')"
        required: true
        default: "notes"
        type: choice
        options:
          - iot
          - notes
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string
      tag:
        description: "Release tag (e.g. iot-v0.2.0)"
        required: true
        type: string
      apk_name:
        description: "APK filename (e.g. sensio-iot-0.2.0.apk)"
        required: true
        type: string
      sha256:
        description: "SHA-256 checksum of the APK"
        required: true
        type: string

jobs:
  sync-docs:
    name: Sync Documentation & Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sensio-hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse release variables
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "type=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
            echo "apk_name=${{ github.event.client_payload.apk_name }}" >> "$GITHUB_OUTPUT"
            echo "sha256=${{ github.event.client_payload.sha256 }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=${{ inputs.type }}-release" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "apk_name=${{ inputs.apk_name }}" >> "$GITHUB_OUTPUT"
            echo "sha256=${{ inputs.sha256 }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release asset accessibility on GitHub Releases
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          APK: ${{ steps.vars.outputs.apk_name }}
        run: |
          set -euo pipefail
          download_url="https://github.com/BIG-FullFill/sensio-hub/releases/download/$TAG/$APK"
          echo "Verifying public download URL: $download_url"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --head "$download_url" >/dev/null 2>&1; then
              echo "Asset verified available on sensio-hub!"
              exit 0
            fi
            echo "Waiting for asset to settle (attempt $attempt)..."
            sleep 5
          done
          echo "Warning: Asset $APK not yet visible on $download_url"

      - name: Update Android documentation
        env:
          TYPE: ${{ steps.vars.outputs.type }}
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          APK_NAME: ${{ steps.vars.outputs.apk_name }}
          SHA256: ${{ steps.vars.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$TYPE" = "notes-release" ] || [[ "$TAG" == notes-* ]]; then
            python3 scripts/sync-notes-release.py
          else
            python3 scripts/sync-iot-release.py
          fi

      - name: Commit and push documentation updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "docs: sync Android release ${{ steps.vars.outputs.tag }}"
            git push origin HEAD
          else
            echo "Documentation already up to date."
          fi
