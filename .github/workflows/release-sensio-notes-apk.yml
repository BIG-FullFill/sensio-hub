name: Sensio Notes Android APK Release

on:
  repository_dispatch:
    types:
      - notes-release
      - notes-apk-release
  workflow_dispatch:
    inputs:
      ref:
        description: "Sensio-Notes-New branch, tag, or commit SHA to build"
        required: false
        default: "main"
      api_base_url:
        description: "Backend API base URL for Capacitor Android app"
        required: false
        default: "https://notes.sensio.id"

permissions: {}

concurrency:
  group: sensio-hub-apk-notes
  cancel-in-progress: false

jobs:
  android-build:
    name: Build & Publish Sensio Notes Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check Sensio Source Token
        env:
          SENSIO_SOURCE_TOKEN: ${{ secrets.SENSIO_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SENSIO_SOURCE_TOKEN" ]; then
            echo "::error::Missing repository secret SENSIO_SOURCE_TOKEN (requires Contents: Read on BIG-FullFill/Sensio-Notes-New)."
            exit 1
          fi

      - name: Checkout sensio-hub
        uses: actions/checkout@v4
        with:
          ref: main
          path: hub
          fetch-depth: 0

      - name: Checkout Sensio-Notes-New Source
        uses: actions/checkout@v4
        with:
          repository: BIG-FullFill/Sensio-Notes-New
          ref: ${{ inputs.ref || github.event.client_payload.sha || 'main' }}
          token: ${{ secrets.SENSIO_SOURCE_TOKEN }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      - name: Resolve Source Commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve Release Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android/resolve-release-version.py

      - name: Set up Java
        if: steps.version.outputs.already_published != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        if: steps.version.outputs.already_published != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web SPA Assets for Capacitor
        if: steps.version.outputs.already_published != 'true'
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL || 'https://notes.sensio.id' }}
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci --prefer-offline --no-audit || npm install
          npm run build
          grep -Fq "$VITE_API_BASE_URL" ../backend/dist/assets/*.js

      - name: Install Mobile Dependencies & Sync Capacitor Android
        if: steps.version.outputs.already_published != 'true'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm ci --prefer-offline --no-audit || npm install
          npm run prebuild:android

      - name: Prepare Generated Android Project
        if: steps.version.outputs.already_published != 'true'
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android/prepare-generated-project.py

      - name: Set up Gradle Cache
        if: steps.version.outputs.already_published != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore Signing (if secret provided)
        if: steps.version.outputs.already_published != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.NOTES_ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.NOTES_ANDROID_RELEASE_KEYSTORE_PASSWORD || secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTES_ANDROID_RELEASE_KEY_ALIAS || secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NOTES_ANDROID_RELEASE_KEY_PASSWORD || secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "Configuring release keystore signing..."
            keystore="$RUNNER_TEMP/sensio-notes-release.p12"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            properties="mobile/android/keystore.properties"
            {
              printf 'storeFile=%s\n' "$keystore"
              printf 'storePassword=%s\n' "$KEYSTORE_PASS"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASS"
            } > "$properties"
            chmod 600 "$properties"
          else
            echo "No release keystore secret configured; building standard debug APK."
          fi

      - name: Build Android APK
        if: steps.version.outputs.already_published != 'true'
        working-directory: src/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --warning-mode=none
          else
            ./gradlew assembleDebug --warning-mode=none
          fi

      - name: Verify and Package APK
        if: steps.version.outputs.already_published != 'true'
        id: package
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          KEYSTORE_B64: ${{ secrets.NOTES_ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            export EXPECTED_ANDROID_CERT_SHA256="97C68E0EA8042DEF1C95BC545B6DA62B2A9C4474A0F4BFAA2322351D7F1F90AC"
          fi
          bash scripts/android/verify-apk.sh

      - name: Publish Release to sensio-hub & Sync Docs
        if: steps.version.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="src/dist/android/$APK_NAME"
          test -s "$source_apk"
          actual_sha="$(sha256sum "$source_apk" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"

          tag="${{ steps.version.outputs.tag }}"
          notes=$(printf 'Sensio Notes v%s\n\nUniversal APK `%s` (version code %s).\nSHA-256: `%s`\nSource commit: %s\n' \
            "$ANDROID_VERSION" "$APK_NAME" "$ANDROID_VERSION_CODE" "$EXPECTED_SHA256" "$SOURCE_COMMIT")

          if gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists on $RELEASE_REPOSITORY; refusing to replace its APK"
            exit 1
          fi

          gh release create "$tag" "$source_apk" \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "Sensio Notes v$ANDROID_VERSION" \
            --notes "$notes"
          gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"

          cd hub
          VERSION="$ANDROID_VERSION" TAG="$tag" APK_NAME="$APK_NAME" SHA256="$EXPECTED_SHA256" \
            python3 scripts/sync-notes-release.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "docs: sync Android release $tag"
            git push origin main
          fi
