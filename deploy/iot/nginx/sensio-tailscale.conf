map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    set $sensio_upstream http://127.0.0.1:3001;

    location / {
        proxy_pass $sensio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen ${SENSIO_ZIGBEE2MQTT_HOST_BIND}:${SENSIO_ZIGBEE2MQTT_HTTPS_PORT};
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    set $zigbee2mqtt_upstream http://127.0.0.1:8080;

    location / {
        proxy_pass $zigbee2mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
