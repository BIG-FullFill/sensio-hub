services:
  sensio-iot:
    image: ${SENSIO_IOT_IMAGE:-ghcr.io/big-fullfill/sensio-iot-new:latest}
    pull_policy: always
    container_name: sensio-iot
    env_file:
      - path: ${SENSIO_IOT_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-sensio-iot}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ANNOTATION_ENABLED: ${ANNOTATION_ENABLED:-false}
      TUYA_ENABLED: ${TUYA_ENABLED:-false}
      MANAGED_MQTT_BROKER_ENABLED: ${MANAGED_MQTT_BROKER_ENABLED:-true}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_CLIENT_ID_SUFFIX: ${MQTT_CLIENT_ID_SUFFIX:-}
      DEEPGRAM_API_BASE_URL: ${DEEPGRAM_API_BASE_URL:-https://api.deepgram.com/v1}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_REQUEST_TIMEOUT_MS: ${DEEPGRAM_REQUEST_TIMEOUT_MS:-45000}
      DEEPGRAM_MAX_RETRIES: ${DEEPGRAM_MAX_RETRIES:-2}
      SENSIO_AI_ENABLED: ${SENSIO_AI_ENABLED:-true}
      SENSIO_AI_NODE_BINARY: ${SENSIO_AI_NODE_BINARY:-node}
      SENSIO_AI_WORKER_PATH: ${SENSIO_AI_WORKER_PATH:-/app/assistant-js/worker.mjs}
      SENSIO_AI_PROTOCOL_TIMEOUT_MS: ${SENSIO_AI_PROTOCOL_TIMEOUT_MS:-60000}
      SENSIO_AI_MAX_STEPS: ${SENSIO_AI_MAX_STEPS:-8}
      SENSIO_AI_MODEL_TIMEOUT_MS: ${SENSIO_AI_MODEL_TIMEOUT_MS:-45000}
      SENSIO_AI_MODEL_MAX_RETRIES: ${SENSIO_AI_MODEL_MAX_RETRIES:-1}
      LLM_IOT_CHAT_REASONING_EFFORT: ${LLM_IOT_CHAT_REASONING_EFFORT:-}
      LLM_IOT_ANALYTICS_REASONING_EFFORT: ${LLM_IOT_ANALYTICS_REASONING_EFFORT:-}
      LLM_CHAT_REASONING_EFFORT: ${LLM_CHAT_REASONING_EFFORT:-}
      ASSISTANT_TTS_BIN: ${ASSISTANT_TTS_BIN:-/opt/edge-tts/bin/edge-tts}
      ASSISTANT_TTS_VOICE: ${ASSISTANT_TTS_VOICE:-id-ID-GadisNeural}
      ASSISTANT_TTS_PITCH: ${ASSISTANT_TTS_PITCH:--10Hz}
      ASSISTANT_TTS_RATE: ${ASSISTANT_TTS_RATE:-+10%}
      DEVICE_TOKEN_ENCRYPTION_KEY_FILE: /run/secret/device_token_encryption_key
      RUST_LOG: ${RUST_LOG:-sensio_iot=info,tower_http=info}
    volumes:
      - "${DEVICE_TOKEN_ENCRYPTION_KEY_HOST_PATH:-./.secrets/device_token_encryption_key}:/run/secret/device_token_encryption_key:ro"
      - /etc/localtime:/etc/localtime:ro
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - shared-mosquitto-config:/var/lib/sensio/mosquitto-config
    ports:
      - "${SENSIO_IOT_HOST_BIND:-0.0.0.0}:${SENSIO_IOT_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - shared-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

networks:
  shared-network:
    name: sensio-shared-network
    driver: bridge

volumes:
  shared-mosquitto-config:
    name: sensio-shared-mosquitto-config
